<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dominó 4 Jogadores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fundo estilo mesa de bilhar/cassino */
            background: radial-gradient(circle at center, #1e6b3b 0%, #0c361c 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Área de jogo dividida em zonas para os 4 jogadores */
        .game-container {
            flex-grow: 1;
            display: grid;
            grid-template-rows: 80px 1fr auto;
            grid-template-columns: 80px 1fr 80px;
            height: 100%;
            position: relative;
        }

        /* Áreas dos Jogadores */
        .area-top { grid-row: 1; grid-column: 1 / 4; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; z-index: 10; }
        .area-left { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 10px; z-index: 10; }
        .area-right { grid-row: 2; grid-column: 3; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding-right: 10px; z-index: 10; }
        .area-bottom { grid-row: 3; grid-column: 1 / 4; background: rgba(0,0,0,0.4); border-top: 2px solid #000; padding: 10px; z-index: 20; min-height: 140px;}

        /* A Mesa Central onde as peças jogadas ficam */
        .table-area {
            grid-row: 2; grid-column: 2;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Ou center se preferir que comece no meio */
            overflow-x: auto;
            overflow-y: hidden;
            padding: 20px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
            border-radius: 20px;
            margin: 10px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .table-area::-webkit-scrollbar { height: 10px; }
        .table-area::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
        .table-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

        .domino {
            background: #f8f9fa;
            border-radius: 6px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.5), inset -1px -1px 3px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            width: 44px;
            height: 88px;
            margin: 4px;
            flex-shrink: 0;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            user-select: none;
        }

        .domino.playable {
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
            border: 2px solid #ffd700;
        }

        .domino.playable:hover {
            transform: translateY(-8px) scale(1.05);
        }

        .domino.horizontal { flex-direction: row; width: 88px; height: 44px; }
        .domino.double { flex-direction: column; width: 44px; height: 88px; }

        .domino-half {
            flex: 1;
            position: relative;
            display: grid;
            grid-template-areas: 
                "tl tc tr"
                "ml mc mr"
                "bl bc br";
            padding: 3px;
            gap: 1px;
        }

        .domino:not(.horizontal) .domino-half:first-child { border-bottom: 2px solid #222; }
        .domino.horizontal .domino-half:first-child { border-right: 2px solid #222; border-bottom: none; }

        .dot {
            width: 8px;
            height: 8px;
            background: #111;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
            box-shadow: inset 1px 1px 1px rgba(255,255,255,0.5);
        }

        .dot-tl { grid-area: tl; } .dot-tc { grid-area: tc; } .dot-tr { grid-area: tr; }
        .dot-ml { grid-area: ml; } .dot-mc { grid-area: mc; } .dot-mr { grid-area: mr; }
        .dot-bl { grid-area: bl; } .dot-bc { grid-area: bc; } .dot-br { grid-area: br; }

        /* Costas das pedras (Players) */
        .domino-back {
            background: #1a1a1a;
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            border-radius: 4px;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.6);
            border: 1px solid #444;
            flex-shrink: 0;
        }

        /* Tamanhos menores para as costas das pedras nas laterais */
        .back-v { width: 30px; height: 16px; margin: 2px 0; }
        .back-h { width: 16px; height: 30px; margin: 0 2px; }

        /* Status de turno e jogador */
        .player-tag {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
            transition: all 0.3s;
        }
        .player-tag.active {
            border-color: #4ade80;
            background: rgba(20, 83, 45, 0.8);
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        /* Modais */
        #message-box, #choice-modal {
            display: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="message-box" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70">
        <div class="bg-gray-800 border-2 border-green-500 rounded-2xl p-6 text-center max-w-sm shadow-2xl mx-4">
            <h2 id="message-title" class="text-2xl font-bold mb-3 text-green-400">Título</h2>
            <p id="message-text" class="text-base mb-5 text-gray-200">Mensagem do jogo.</p>
            <button id="message-btn" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-8 rounded-full transition w-full">OK</button>
        </div>
    </div>

    <div id="choice-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70">
        <div class="bg-gray-800 rounded-2xl p-6 text-center max-w-sm border border-gray-500 mx-4 shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-white">Escolha onde jogar:</h3>
            <div class="flex gap-4 justify-center">
                <button id="btn-left" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg shadow font-bold text-white flex-1">Esquerda</button>
                <button id="btn-right" class="bg-purple-600 hover:bg-purple-500 px-6 py-3 rounded-lg shadow font-bold text-white flex-1">Direita</button>
            </div>
            <button onclick="closeChoiceModal()" class="mt-4 text-gray-400 hover:text-white text-sm underline">Cancelar</button>
        </div>
    </div>

    <div class="flex justify-between items-center px-4 py-2 bg-black bg-opacity-60 shadow">
        <div>
            <h1 class="text-xl font-black text-green-400 tracking-wider">DOMINÓ</h1>
            <p id="system-status" class="text-xs text-gray-300">Distribuindo pedras...</p>
        </div>
        <button onclick="initGame()" class="bg-gray-700 hover:bg-gray-600 border border-gray-500 px-3 py-1.5 rounded text-xs transition text-white">Reiniciar</button>
    </div>

    <div class="game-container">
        <!-- Topo: Player 2 -->
        <div class="area-top flex-col items-center">
            <div id="tag-2" class="player-tag mb-2">Player 2 (Topo) <span id="count-2" class="bg-gray-700 px-2 rounded-full text-xs">7</span></div>
            <div id="hand-2" class="flex"></div>
        </div>

        <!-- Esquerda: Player 1 -->
        <div class="area-left flex-row items-center">
            <div id="hand-1" class="flex flex-col mr-2"></div>
            <div id="tag-1" class="player-tag" style="writing-mode: vertical-rl; transform: rotate(180deg);">Player 1 <span id="count-1" class="bg-gray-700 py-1 px-2 rounded-full text-xs mt-1">7</span></div>
        </div>

        <!-- Mesa Central -->
        <div class="table-area" id="board">
            <div id="board-container" class="flex items-center mx-auto transition-all duration-300">
                <!-- Pedras renderizadas aqui -->
            </div>
        </div>

        <!-- Direita: Player 3 -->
        <div class="area-right flex-row items-center justify-end">
            <div id="tag-3" class="player-tag" style="writing-mode: vertical-rl;">Player 3 <span id="count-3" class="bg-gray-700 py-1 px-2 rounded-full text-xs mb-1">7</span></div>
            <div id="hand-3" class="flex flex-col ml-2"></div>
        </div>

        <!-- Base: Você (Jogador 0) -->
        <div class="area-bottom flex flex-col items-center justify-center relative">
            <div id="tag-0" class="player-tag absolute top-[-15px] bg-green-900 border-green-500">
                Sua Mão <span id="count-0" class="bg-green-700 px-2 rounded-full text-xs text-white">7</span>
            </div>
            <div id="hand-0" class="flex gap-1 sm:gap-2 justify-center flex-wrap mt-2">
                <!-- Suas pedras aqui -->
            </div>
        </div>
    </div>

    <script>
        let tiles = [];
        let players = [
            { id: 0, name: 'Você', type: 'human', hand: [] },
            { id: 1, name: 'Player 1', type: 'bot', hand: [] },
            { id: 2, name: 'Player 2', type: 'bot', hand: [] },
            { id: 3, name: 'Player 3', type: 'bot', hand: [] }
        ];
        
        let board = []; // [{ val1, val2, isDouble }]
        let boardLeftEnd = null;
        let boardRightEnd = null;
        
        let currentTurnIndex = 0;
        let consecutivePasses = 0; // Para checar se o jogo trancou
        let gameState = 'init'; // init, playing, ended
        
        let selectedTileIndex = -1;

        const msgBox = document.getElementById('message-box');
        const msgTitle = document.getElementById('message-title');
        const msgText = document.getElementById('message-text');
        const msgBtn = document.getElementById('message-btn');
        const choiceModal = document.getElementById('choice-modal');
        const sysStatus = document.getElementById('system-status');

        function createTiles() {
            tiles = [];
            for (let i = 0; i <= 6; i++) {
                for (let j = i; j <= 6; j++) {
                    tiles.push([i, j]);
                }
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame() {
            createTiles();
            shuffle(tiles);

            // Distribui 7 para cada um dos 4 jogadores
            for(let i=0; i<4; i++) {
                players[i].hand = tiles.splice(0, 7);
            }
            
            board = [];
            boardLeftEnd = null;
            boardRightEnd = null;
            consecutivePasses = 0;
            gameState = 'playing';

            determineFirstPlayer();
            updateUI();
        }

        function determineFirstPlayer() {
            let maxDoubleVal = -1;
            let startPlayerIdx = -1;

            // Encontra a maior carroça entre todos os jogadores
            for(let i=0; i<4; i++) {
                for(let t of players[i].hand) {
                    if (t[0] === t[1] && t[0] > maxDoubleVal) {
                        maxDoubleVal = t[0];
                        startPlayerIdx = i;
                    }
                }
            }

            if (startPlayerIdx > -1) {
                currentTurnIndex = startPlayerIdx;
                let playerName = players[startPlayerIdx].name;
                showMessage("Início do Jogo", `${playerName} começa com a carroça de ${maxDoubleVal}.`, startTurn);
            } else {
                // Se não houver carroças (raro, mas possível em outras variantes, aqui distribuindo 28 sempre terá)
                currentTurnIndex = 0;
                showMessage("Início do Jogo", "O jogador com a maior soma inicia.", startTurn);
            }
        }

        function startTurn() {
            msgBox.style.display = 'none';
            processTurn();
        }

        function processTurn() {
            if (gameState === 'ended') return;
            updateUI();

            let currentPlayer = players[currentTurnIndex];
            sysStatus.innerText = `Turno de: ${currentPlayer.name}`;

            if (!hasValidMoves(currentPlayer.hand)) {
                consecutivePasses++;
                
                if (consecutivePasses >= 4) {
                    handleBlockedGame();
                    return;
                }

                let msg = currentPlayer.type === 'human' 
                    ? "Você não tem jogadas possíveis. Passou a vez." 
                    : `${currentPlayer.name} passou a vez.`;

                setTimeout(() => {
                    sysStatus.innerText = msg;
                    // Mostra aviso rápido e passa
                    if (currentPlayer.type === 'human') {
                        showMessage("Passou a vez", msg, nextTurn);
                    } else {
                        setTimeout(nextTurn, 1500);
                    }
                }, 500);
                return;
            }

            // Tem jogada
            consecutivePasses = 0;

            if (currentPlayer.type === 'bot') {
                setTimeout(computerPlay, 1000);
            }
            // Se for humano, apenas aguarda o click no UI (atualizado no updateUI)
        }

        function nextTurn() {
            if (gameState === 'ended') return;
            
            // Verifica vitória antes de passar
            if (players[currentTurnIndex].hand.length === 0) {
                let winner = players[currentTurnIndex];
                let title = winner.type === 'human' ? "Você Venceu!" : `${winner.name} Venceu!`;
                endGame(title, `${winner.name} bateu o jogo!`);
                return;
            }

            currentTurnIndex = (currentTurnIndex + 1) % 4;
            processTurn();
        }

        function isValidPlay(tile) {
            if (board.length === 0) return true;
            return tile[0] === boardLeftEnd || tile[1] === boardLeftEnd || 
                   tile[0] === boardRightEnd || tile[1] === boardRightEnd;
        }

        function hasValidMoves(hand) {
            if (board.length === 0) return true;
            return hand.some(isValidPlay);
        }

        function onPlayerClickTile(index) {
            let currentPlayer = players[currentTurnIndex];
            if (currentPlayer.type !== 'human' || gameState !== 'playing') return;
            
            const tile = currentPlayer.hand[index];
            if (!isValidPlay(tile)) return;

            if (board.length === 0) {
                playTileOnBoard(tile, 'right');
                currentPlayer.hand.splice(index, 1);
                nextTurn();
                return;
            }

            let canLeft = (tile[0] === boardLeftEnd || tile[1] === boardLeftEnd);
            let canRight = (tile[0] === boardRightEnd || tile[1] === boardRightEnd);

            if (canLeft && canRight && boardLeftEnd !== boardRightEnd) {
                selectedTileIndex = index;
                choiceModal.style.display = 'flex';
            } else if (canLeft) {
                playTileOnBoard(tile, 'left');
                currentPlayer.hand.splice(index, 1);
                nextTurn();
            } else if (canRight) {
                playTileOnBoard(tile, 'right');
                currentPlayer.hand.splice(index, 1);
                nextTurn();
            }
        }

        document.getElementById('btn-left').onclick = () => {
            if (selectedTileIndex > -1) {
                const currentHuman = players[currentTurnIndex];
                const tile = currentHuman.hand[selectedTileIndex];
                if (!tile) return;

                playTileOnBoard(tile, 'left');
                currentHuman.hand.splice(selectedTileIndex, 1);
                closeChoiceModal();
                nextTurn();
            }
        };

        document.getElementById('btn-right').onclick = () => {
            if (selectedTileIndex > -1) {
                const currentHuman = players[currentTurnIndex];
                const tile = currentHuman.hand[selectedTileIndex];
                if (!tile) return;

                playTileOnBoard(tile, 'right');
                currentHuman.hand.splice(selectedTileIndex, 1);
                closeChoiceModal();
                nextTurn();
            }
        };

        function closeChoiceModal() {
            choiceModal.style.display = 'none';
            selectedTileIndex = -1;
        }

        function computerPlay() {
            let currentPlayer = players[currentTurnIndex];
            if (currentPlayer.type !== 'bot' || gameState !== 'playing') return;

            let validMoves = [];
            for (let i = 0; i < currentPlayer.hand.length; i++) {
                let t = currentPlayer.hand[i];
                if (isValidPlay(t)) validMoves.push({ index: i, tile: t });
            }

            if (validMoves.length > 0) {
                // Estratégia simples: joga a pedra de maior valor (ou carroça)
                validMoves.sort((a, b) => {
                    let aScore = (a.tile[0] === a.tile[1] ? 50 : 0) + (a.tile[0] + a.tile[1]);
                    let bScore = (b.tile[0] === b.tile[1] ? 50 : 0) + (b.tile[0] + b.tile[1]);
                    return bScore - aScore;
                });

                let move = validMoves[0];
                let t = move.tile;
                
                let canLeft = board.length === 0 || t[0] === boardLeftEnd || t[1] === boardLeftEnd;
                let canRight = board.length === 0 || t[0] === boardRightEnd || t[1] === boardRightEnd;

                let side = 'right';
                if (canLeft && canRight) {
                    side = Math.random() > 0.5 ? 'left' : 'right';
                } else if (canLeft) {
                    side = 'left';
                }

                playTileOnBoard(t, side);
                currentPlayer.hand.splice(move.index, 1);
                nextTurn();
            } else {
                // Não deve cair aqui devido ao hasValidMoves prévio, mas por segurança:
                consecutivePasses++;
                nextTurn();
            }
        }

        function playTileOnBoard(tile, side) {
            let isDouble = tile[0] === tile[1];
            let placedTile = { val1: tile[0], val2: tile[1], isDouble: isDouble };

            if (board.length === 0) {
                board.push(placedTile);
                boardLeftEnd = tile[0];
                boardRightEnd = tile[1];
            } else {
                if (side === 'left') {
                    if (tile[0] === boardLeftEnd) { placedTile.val1 = tile[1]; placedTile.val2 = tile[0]; } 
                    else { placedTile.val1 = tile[0]; placedTile.val2 = tile[1]; }
                    board.unshift(placedTile);
                    boardLeftEnd = placedTile.val1;
                } else if (side === 'right') {
                    if (tile[1] === boardRightEnd) { placedTile.val1 = tile[1]; placedTile.val2 = tile[0]; } 
                    else { placedTile.val1 = tile[0]; placedTile.val2 = tile[1]; }
                    board.push(placedTile);
                    boardRightEnd = placedTile.val2;
                }
            }

            // Scroll automático
            setTimeout(() => {
                const bContainer = document.getElementById('board');
                if(side === 'right' || board.length === 1) {
                    bContainer.scrollLeft = bContainer.scrollWidth;
                } else {
                    bContainer.scrollLeft = 0;
                }
            }, 50);
        }

        function handleBlockedGame() {
            gameState = 'ended';
            
            // Calcula pontos
            let sums = players.map(p => {
                let total = p.hand.reduce((acc, t) => acc + t[0] + t[1], 0);
                return { id: p.id, name: p.name, sum: total };
            });

            sums.sort((a, b) => a.sum - b.sum); // Menor para maior
            
            let winner = sums[0];
            let resultTxt = `O jogo trancou! (Todos passaram).\n\nPontos:\n`;
            sums.forEach(s => resultTxt += `${s.name}: ${s.sum} pontos\n`);
            
            let title = winner.id === 0 ? "Você Venceu por Pontos!" : `${winner.name} Venceu por Pontos!`;

            // Tratamento de empate estrito (mesma pontuação menor) - opcional, mas manteremos o 1º achado como vencedor simples
            endGame(title, resultTxt);
        }

        function endGame(title, text) {
            gameState = 'ended';
            updateUI();
            showMessage(title, text, initGame);
            document.getElementById('message-btn').innerText = "Jogar Novamente";
        }

        function showMessage(title, text, callback = null) {
            msgTitle.innerText = title;
            msgText.innerText = text;
            msgBox.style.display = 'flex';
            msgBtn.innerText = "Continuar";
            msgBtn.onclick = () => {
                msgBox.style.display = 'none';
                if (callback) callback();
            };
        }

        function renderDots(value) {
            let html = `<div class="domino-half">`;
            const d = (c) => `<div class="dot ${c}"></div>`;
            switch(value) {
                case 1: html += d('dot-mc'); break;
                case 2: html += d('dot-tl') + d('dot-br'); break;
                case 3: html += d('dot-tl') + d('dot-mc') + d('dot-br'); break;
                case 4: html += d('dot-tl') + d('dot-tr') + d('dot-bl') + d('dot-br'); break;
                case 5: html += d('dot-tl') + d('dot-tr') + d('dot-mc') + d('dot-bl') + d('dot-br'); break;
                case 6: html += d('dot-tl') + d('dot-ml') + d('dot-bl') + d('dot-tr') + d('dot-mr') + d('dot-br'); break;
            }
            html += `</div>`;
            return html;
        }

        function createDominoElement(val1, val2, isPlayable, onClickIndex = -1, isHorizontal = false, isDouble = false) {
            let wrapper = document.createElement('div');
            wrapper.className = `domino text-black`;
            if (isHorizontal && !isDouble) wrapper.classList.add('horizontal');
            if (isDouble) wrapper.classList.add('double');
            if (isPlayable) wrapper.classList.add('playable');
            
            if (onClickIndex > -1) {
                wrapper.onclick = () => onPlayerClickTile(onClickIndex);
            }

            wrapper.innerHTML = renderDots(val1) + renderDots(val2);
            return wrapper;
        }

        function updateUI() {
            // Atualiza tags e contadores dos 4 jogadores
            for (let i = 0; i < 4; i++) {
                let tag = document.getElementById(`tag-${i}`);
                let count = document.getElementById(`count-${i}`);
                count.innerText = players[i].hand.length;
                
                if (currentTurnIndex === i && gameState === 'playing') {
                    tag.classList.add('active');
                } else {
                    tag.classList.remove('active');
                }
            }

            // Renderiza mãos dos players (costas das pedras ou reveladas no fim)
            for (let i = 1; i <= 3; i++) {
                let handDiv = document.getElementById(`hand-${i}`);
                handDiv.innerHTML = '';
                let isVertical = (i === 1 || i === 3);
                
                if (gameState === 'ended') {
                    // Revelar pedras
                    players[i].hand.forEach(t => {
                        let dom = createDominoElement(t[0], t[1], false);
                        if(isVertical) dom.style.transform = 'scale(0.6) rotate(90deg)';
                        else dom.style.transform = 'scale(0.6)';
                        dom.style.margin = '-10px';
                        handDiv.appendChild(dom);
                    });
                } else {
                    // Costas
                    let backClass = isVertical ? 'back-v' : 'back-h';
                    players[i].hand.forEach(() => {
                        let back = document.createElement('div');
                        back.className = `domino-back ${backClass}`;
                        handDiv.appendChild(back);
                    });
                }
            }

            // Renderiza sua mão (Jogador 0)
            const p0HandDiv = document.getElementById('hand-0');
            p0HandDiv.innerHTML = '';
            let p0 = players[0];
            p0.hand.forEach((t, index) => {
                let isPlayable = currentTurnIndex === 0 && gameState === 'playing' && isValidPlay(t);
                p0HandDiv.appendChild(createDominoElement(t[0], t[1], isPlayable, index));
            });

            // Renderiza Mesa Central
            const boardContainer = document.getElementById('board-container');
            boardContainer.innerHTML = '';
            board.forEach(t => {
                boardContainer.appendChild(createDominoElement(t.val1, t.val2, false, -1, true, t.isDouble));
            });
        }

        // Bootstrap do jogo
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
